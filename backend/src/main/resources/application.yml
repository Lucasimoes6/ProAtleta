spring:
  application:
    name: athlete-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    # Mantém a sessão Hibernate aberta durante a renderização do response,
    # evitando LazyInitializationException ao tocar associações como Athlete.user
    # nos *Response.from(). Trocaria por @Transactional nos controllers em
    # produção; para dev é o suficiente.
    open-in-view: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    # show-sql desligado por padrão; habilite por perfil (ex.: SHOW_SQL=true) se debugando.
    show-sql: ${SHOW_SQL:false}

server:
  # Railway/Render injetam PORT — local cai no default 8080.
  port: ${PORT:8080}
  error:
    include-message: always

app:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-this-key-must-be-at-least-256-bits-long-please}
      expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # Banco em arquivo (./data/athlete-db) — sobrevive a restarts.
    # AUTO_SERVER=TRUE permite o H2 Console (browser) abrir mesmo com o app rodando.
    url: jdbc:h2:file:./data/athlete-db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
